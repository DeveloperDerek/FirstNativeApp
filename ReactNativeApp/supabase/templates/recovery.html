<h2>Reset your password</h2>
<p>Tap the link below on your phone to set a new StepTracker password.</p>
<p><a href="reactnativeapp://auth/reset?token_hash={{ .TokenHash }}&type=recovery">Set a new password</a></p>
<p>The link works once and expires in 1 hour.</p>
<p>If you didn't ask for this, ignore this email.</p>
